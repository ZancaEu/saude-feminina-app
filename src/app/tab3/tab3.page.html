<ion-header>
  <ion-toolbar>
    <ion-title>Minha Saúde Feminina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <div class="education-banner">
      <h2>Conteúdos</h2>
      <p>Informação segura para sua saúde e bem-estar</p>
    </div>

    <!-- Category Tabs -->
    <div class="tabs">
      <button class="tab" [class.active]="!selectedCategoryId" (click)="selectCategory(undefined)">
        Todos
      </button>
      <button class="tab" *ngFor="let cat of categories" [class.active]="selectedCategoryId === cat.id"
        (click)="selectCategory(cat.id)">
        {{ cat.name }}
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-container">
      <ion-card class="article-card skeleton" *ngFor="let i of [1,2,3]">
        <ion-card-content>
          <ion-skeleton-text [animated]="true"
            style="width: 60%; height: 20px; margin-bottom: 8px;"></ion-skeleton-text>
          <ion-skeleton-text [animated]="true" style="width: 100%; height: 14px;"></ion-skeleton-text>
          <ion-skeleton-text [animated]="true" style="width: 80%; height: 14px;"></ion-skeleton-text>
        </ion-card-content>
      </ion-card>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError && !isLoading" class="error-container">
      <ion-icon name="cloud-offline-outline" size="large"></ion-icon>
      <p>Não foi possível carregar os conteúdos.</p>
      <ion-button fill="outline" (click)="retry()">Tentar Novamente</ion-button>
    </div>

    <!-- Articles List -->
    <div *ngIf="!isLoading && !hasError">
      <ion-card class="article-card" *ngFor="let article of articles" (click)="openArticle(article)">
        <img *ngIf="article.cover_image" [src]="article.cover_image" alt="" class="article-cover">
        <ion-card-content>
          <h3>{{ article.title }}</h3>
          <p>{{ getExcerpt(article.body) }}</p>
          <span class="read-more">Ler mais →</span>
        </ion-card-content>
      </ion-card>

      <div *ngIf="articles.length === 0" class="empty-state">
        <p>Nenhum artigo disponível nesta categoria.</p>
      </div>
    </div>
  </div>
</ion-content>
