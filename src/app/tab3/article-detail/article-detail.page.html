<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab3"></ion-back-button>
    </ion-buttons>
    <ion-title>Artigo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading -->
  <div *ngIf="isLoading" class="container">
    <ion-skeleton-text [animated]="true" style="width: 80%; height: 28px; margin-bottom: 16px;"></ion-skeleton-text>
    <ion-skeleton-text [animated]="true" style="width: 100%; height: 14px;" *ngFor="let i of [1,2,3,4,5]"></ion-skeleton-text>
  </div>

  <!-- Error -->
  <div *ngIf="hasError && !isLoading" class="container error-container">
    <ion-icon name="alert-circle-outline" size="large"></ion-icon>
    <p>Não foi possível carregar o artigo.</p>
    <ion-button fill="outline" (click)="goBack()">Voltar</ion-button>
  </div>

  <!-- Article Content -->
  <div *ngIf="article && !isLoading" class="container">
    <img *ngIf="article.cover_image" [src]="article.cover_image" alt="" class="cover-image">
    <h1>{{ article.title }}</h1>
    <div class="article-meta" *ngIf="article.category">
      <ion-chip>{{ article.category.name }}</ion-chip>
    </div>
    <div class="article-body" [innerHTML]="safeBody"></div>
  </div>
</ion-content>
