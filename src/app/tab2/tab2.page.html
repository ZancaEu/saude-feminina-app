<ion-header>
  <ion-toolbar>
    <ion-title>Minha Saúde Feminina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <h2>Calendário Menstrual</h2>

    <ion-card class="calendar-card">
      <ion-card-content>
        <div class="calendar-header">
          <ion-icon name="chevron-back-outline" (click)="previousMonth()"></ion-icon>
          <h3>{{ monthName }}</h3>
          <ion-icon name="chevron-forward-outline" (click)="nextMonth()"></ion-icon>
        </div>

        <div class="week-days">
          <span *ngFor="let day of weekDays">{{ day }}</span>
        </div>

        <div class="calendar-grid">
          <span *ngFor="let dayObj of calendarDays" [class.has-day]="dayObj.day" (click)="onDayTap(dayObj)">
            {{ dayObj.day }}
            <div class="dot" *ngIf="dayObj.type" [class.pink]="dayObj.type === 'menstruation'"
              [class.orange]="dayObj.type === 'fertile'" [class.green]="dayObj.type === 'ovulation'">
            </div>
          </span>
        </div>

        <div class="legend">
          <span>
            <div class="dot pink"></div> Menstruação
          </span>
          <span>
            <div class="dot orange"></div> Fértil
          </span>
          <span>
            <div class="dot green"></div> Ovulação
          </span>
        </div>
      </ion-card-content>
    </ion-card>

    <p class="hint-text">Toque em um dia para registrar início ou fim do ciclo</p>
  </div>
</ion-content>
