<ion-header>
  <ion-toolbar>
    <ion-title>Minha Saúde Feminina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <h2>Calendário Menstrual</h2>

    <ion-card class="calendar-card">
      <ion-card-content>
        <div class="calendar-header">
          <ion-icon name="chevron-back-outline" (click)="previousMonth()"></ion-icon>
          <h3>{{ monthName }}</h3>
          <ion-icon name="chevron-forward-outline" (click)="nextMonth()"></ion-icon>
        </div>

        <div class="week-days">
          <span *ngFor="let day of weekDays">{{ day }}</span>
        </div>

        <div class="calendar-grid">
          <div *ngFor="let dayObj of calendarDays" class="day-cell" [class.has-day]="dayObj.day"
            [class.is-today]="dayObj.isToday" (click)="onDayTap(dayObj)">
            <span class="day-number">{{ dayObj.day }}</span>
            <div class="dots" *ngIf="dayObj.types.length > 0">
              <div class="dot" *ngFor="let type of dayObj.types" [class.pink]="type === 'menstruation'"
                [class.orange]="type === 'fertile'" [class.green]="type === 'ovulation'"
                [class.blue]="type === 'reminder'" [class.purple]="type === 'note'">
              </div>
            </div>
          </div>
        </div>

        <div class="legend">
          <span>
            <div class="dot pink"></div> Menstruação
          </span>
          <span>
            <div class="dot orange"></div> Fértil
          </span>
          <span>
            <div class="dot green"></div> Ovulação
          </span>
          <span>
            <div class="dot blue"></div> Lembrete
          </span>
          <span>
            <div class="dot purple"></div> Anotação
          </span>
        </div>
      </ion-card-content>
    </ion-card>

    <p class="hint-text">Toque em um dia para adicionar eventos</p>
  </div>
</ion-content>
